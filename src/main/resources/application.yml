server:
  port: ${SERVER_PORT:8432}
  servlet:
    context-path: ${CONTEXT_PATH:/api}
    application-display-name: ${spring.application.name}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: @project.name@
  config:
    import:
      - classpath:/logging.yml
      - classpath:/eureka.yml
      - classpath:/management.yml
      - classpath:/security.yml
      - classpath:/keycloak.yml
  devtools:
    restart:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      org:
        hibernate:
          envers:
            audit_strategy: org.hibernate.envers.strategy.internal.ValidityAuditStrategy
            default_schema: ${spring.jpa.properties.hibernate.default_schema:history}
            audit_table_suffix: _history
            revision_field_name: rev_id
            revision_type_field_name: rev_type
            store_data_at_delete: true
      hibernate:
        enable_lazy_load_no_trans: true
        default_schema: dotaskx
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
